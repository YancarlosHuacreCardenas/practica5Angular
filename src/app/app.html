<style>
  :host {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: block;
    width: 100%;
    height: 100%;
  }

  main {
    flex: 1;
    margin-left: 228px;
    min-height: 100vh;
    background-color: #f5f6f8;
    transition: margin-left 0.3s ease;
    padding: 0;
    overflow-x: hidden;
  }

  @media (max-width: 768px) {
    main {
      margin-left: 64px;
    }
  }

  @media (max-width: 600px) {
    main {
      margin-left: 0;
    }
  }
</style>

<app-sidebar (menuSelected)="onMenuSelected($event)"></app-sidebar>
<main class="main">
  <app-customer-list *ngIf="activeMenu === 'trabajadores'"></app-customer-list>
  <app-supplier-list *ngIf="activeMenu === 'proveedores'"></app-supplier-list>
  <app-product-list [hidden]="activeMenu !== 'productos'"></app-product-list>
</main>
